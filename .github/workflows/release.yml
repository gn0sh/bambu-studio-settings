name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create on main, like v1.0.0"
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run from main only
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "run from main only" >&2; exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "tag is not on main" >&2; exit 1; }

      - name: Build one zip per skill
        run: |
          set -euo pipefail
          for skill in bambu-studio-settings print-object-analyzer telltile; do
            test -d "$skill" || { echo "missing skill folder: $skill" >&2; exit 1; }
            git archive --format=zip -o "$skill.zip" HEAD "$skill"
          done
          sha256sum ./*.zip > SHA256SUMS
          ls -l ./*.zip SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="$INPUT_VERSION"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "tag $TAG already exists" >&2; exit 1; fi
          gh release create "$TAG" ./*.zip SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Skill zips for $TAG: bambu-studio-settings, print-object-analyzer, telltile. Upload a zip as a skill, or copy its folder into your skills folder."
